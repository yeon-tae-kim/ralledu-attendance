<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>롤에듀 (Rall Edu) 근태관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#233047;font:14px system-ui,sans-serif}header{background:#172c4e;color:white;padding:24px max(20px,calc((100% - 1100px)/2))}header small{letter-spacing:3px;color:#a9c8ff}h1{margin:8px 0;font-size:26px}main{max-width:1140px;margin:auto;padding:20px}nav,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}nav{margin-bottom:20px}button,input,select,textarea{font:inherit;border:1px solid #d9e0e9;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active,.primary{background:#2857a0;color:white;border-color:#2857a0}button:hover{filter:brightness(.96)}.panel{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:20px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.stat{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:16px}.stat b{display:block;font-size:28px;margin-top:8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.actions button{padding:20px 4px;font-weight:bold;border:0}.green{background:#e0f4e9;color:#167447}.blue{background:#e3ebfa;color:#2857a0}.orange{background:#fff0d8;color:#9d5b08}.purple{background:#eee6fa;color:#7046a9}.gray{background:#edf0f5;color:#68758a}.pill{display:inline-block;padding:5px 9px;border-radius:7px;white-space:nowrap}.muted{color:#6c788b;font-size:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f5}th{background:#f6f8fb;color:#68758a}h2{font-size:18px;margin:0 0 14px}label{display:inline-flex;flex-direction:column;gap:5px}textarea{width:100%;min-height:80px} .warn{background:#fff5e5;padding:12px;border-radius:8px;margin:12px 0}.right{margin-left:auto}@media(max-width:600px){main{padding:12px}.panel{padding:14px}nav button{flex:1;font-size:12px;padding:8px}.actions{grid-template-columns:repeat(2,1fr)}} </style><header><small>롤에듀 (Rall Edu) · PEOPLE</small><h1>출퇴근 관리 대시보드 V5</h1><div id="clock"></div></header><main><div class="warn">체험용 · 이 브라우저에만 저장됩니다. 실제 직원 로그인, 공동 데이터 및 자동 알림 발송은 서버 연결 후 가능합니다. 예정 종료는 업무시간과 설정 휴게시간으로 계산한 추정값이며, 실근무는 실제 경과시간에서 등록 시 휴게시간을 차감합니다.</div><nav id="nav"></nav><div id="view"></div></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),time=()=>new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul'}).slice(0,5);let db;try{db=JSON.parse(localStorage.getItem('ralledu-v2'))}catch{}if(!db)db={people:['예시 직원'].map((name,i)=>({id:String(i+1),name,days:[1,2,3,4,5],start:'09:00',end:'18:00',break:60,rate:0})),records:{},requests:[],reports:{}};db.schedule ||= {}; db.confirm ||= {};
let tab='today',date=today(),month=date.slice(0,7),person=db.people[0].id;const save=()=>localStorage.setItem('ralledu-v2',JSON.stringify(db));const rec=(id,d=date)=>db.records[d+'|'+id]||{};const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};const elapsed=r=>r.start&&r.end?Math.max(0,r.endAt&&r.startAt?Math.floor((r.endAt-r.startAt)/60000):mins(r.end)-mins(r.start)):0;
const duration=(r,p)=>Math.max(0,elapsed(r)-Number(r.breakMinutes??p.break??0));
const clockText=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+(m>=1440?' (+1일)':'');
const actualText=(r,p)=>r.end?`${r.start}-${r.end} · ${fmt(duration(r,p))}`:r.start?`${r.start}-진행 중`:'—';const fmt=m=>Math.floor(m/60)+'시간 '+m%60+'분';const daynum=d=>new Date(d+'T12:00:00+09:00').getUTCDay();const plan=(p,d)=>db.schedule?.[d.slice(0,7)]?.[d]?.[p.id];
const imported=d=>!!db.schedule?.[d.slice(0,7)];
const planned=(p,d)=>imported(d)?!!plan(p,d)?.start:p.days.includes(daynum(d));
const planText=(p,d)=>{let q=plan(p,d);if(imported(d)){if(!q)return '예정 없음';if(!q.start)return esc(q.label);let h=q.hours!=null?Number(q.hours):null;let range=q.multi?esc(q.start)+' · 분할근무 확인':esc(q.start)+'-'+(h!=null?clockText(mins(q.start)+Math.round(h*60)+Number(p.break||0)):'미정');return esc(q.mode)+' '+range+(h!=null?' · '+fmt(Math.round(h*60)):'')+(q.multi?' <span class="muted">(원본 확인)</span>':'');}return planned(p,d)?`${p.start}-${p.end} · ${fmt(Math.max(0,mins(p.end)-mins(p.start)-Number(p.break||0)))}`:'비근무일'};
const state=(r)=>r.leave?'휴무':r.end?'퇴근':r.start?r.mode:'미등록';const cls=s=>({'출근':'green','퇴근':'blue','휴무':'orange','재택근무':'purple','미등록':'gray'}[s]||'gray');const pill=s=>`<span class="pill ${cls(s)}">${esc(s)}</span>`;const options=()=>db.people.map(p=>`<option value="${p.id}" ${p.id===person?'selected':''}>${esc(p.name)}</option>`).join('');const tabs={today:'오늘의 근태',month:'월간 근태·급여',requests:'휴무·재택 승인',reports:'업무보고',staff:'직원 관리',schedule:'구글 시트 근무표'};function table(head,rows){return `<div class="table"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function row(a){return '<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}function flags(p,d,r){if(!planned(p,d)||r.leave)return '';let q=plan(p,d),start=q?.start||p.start;if(q?.multi)return '분할근무 확인 필요';if(r.start&&r.start>start)return '지각';if(!r.start&&(d<today()||(d===today()&&time()>start)))return d<today()?'결근 확인 필요':'출근 미등록';if(r.start&&!r.end&&(d<today()||(d===today()&&!imported(d)&&time()>p.end)))return '퇴근 미등록';return ''}function render(){ $('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');let html='';if(tab==='today'){let r=rec(person);html=`<div class="stats">${['전체','출근','재택근무','퇴근','휴무','미등록'].map(s=>`<div class="stat">${s}<b>${s==='전체'?db.people.length:db.people.filter(p=>state(rec(p.id))===s).length}</b></div>`).join('')}</div><div class="panel"><h2>나의 근태 등록</h2><div class="row"><select onchange="person=this.value;render()">${options()}</select><input type="date" value="${date}" onchange="date=this.value;render()">${pill(state(r))}</div><p>선택일 예정: <b>${planText(db.people.find(p=>p.id===person),date)}</b></p><div class="actions">${['출근','퇴근','휴무','재택근무'].map(s=>`<button class="${cls(s)}" onclick="mark('${s}')">${s}</button>`).join('')}</div><input id="note" style="width:100%" placeholder="특이사항 (선택)" value="${esc(r.note)}"><p class="muted">출근 ${r.start||'—'} / 퇴근 ${r.end||'—'} · 실제 근무 유형 ${r.mode||'—'} · 실근무 ${r.end?fmt(duration(r,db.people.find(p=>p.id===person))):'퇴근 후 확정'}</p></div><div class="panel"><h2>직원별 근무 현황</h2>${table(['직원','상태','예정 시간 · 예정 근무','실제 출퇴근','실근무','확인사항','출퇴근 등록','관리자 확인'],db.people.map(p=>{let r=rec(p.id);return row([esc(p.name),pill(state(r)),planText(p,date),r.start?(r.start+'-'+(r.end||'진행 중')):'—',r.end?fmt(duration(r,p)):'—',esc(flags(p,date,r)),`<button ${date!==today()||r.end||r.leave?'disabled':''} onclick="rowMark('${p.id}')">${r.start?'퇴근 체크':plan(p,date)?.mode==='재택근무'?'재택 시작':'출근 체크'}</button>`,`<label style="flex-direction:row"><input type="checkbox" ${db.confirm[date+'|'+p.id]?'checked':''} onchange="confirmPlan('${p.id}',this.checked)">확인</label>`])}))}</div><div class="panel"><h2>근태 확인 알림</h2>${db.people.map(p=>{let f=flags(p,date,rec(p.id));return f?`<p>${esc(p.name)} · ${esc(f)}</p>`:''}).join('')||'<p class="muted">확인할 사항이 없습니다.</p>'}<p class="muted">화면 내 알림이며 외부 메시지는 발송하지 않습니다.</p></div>`}if(tab==='month'){let dates=Object.keys(db.records).filter(k=>k.startsWith(month));html=`<div class="panel"><h2>월간 근태 및 급여 추정</h2><div class="row"><input type="month" value="${month}" onchange="month=this.value;render()"><button onclick="csv()">CSV 저장</button></div><p class="muted">시급 × 휴게시간 차감 근무시간. 주휴·연장·세금 등 미반영, 급여 확정용 아님.</p>${table(['직원','근무일','재택일','휴무일','근무시간','지각','기본급 추정'],db.people.map(p=>{let rs=dates.filter(k=>k.endsWith('|'+p.id)).map(k=>[k.split('|')[0],db.records[k]]);let m=rs.reduce((a,[d,r])=>a+duration(r,p),0);return row([esc(p.name),rs.filter(([d,r])=>r.start).length,rs.filter(([d,r])=>r.mode==='재택근무').length,rs.filter(([d,r])=>r.leave).length,fmt(m),rs.filter(([d,r])=>flags(p,d,r)==='지각').length,Math.round(m/60*p.rate).toLocaleString()+'원'])}))}</div><div class="panel"><h2>상세 기록</h2>${table(['날짜','직원','유형','예정 시간','실제 출퇴근','실근무','비고'],dates.sort().map(k=>{let [d,id]=k.split('|'),r=db.records[k];return row([d,esc(db.people.find(p=>p.id===id)?.name),esc(r.leave?'휴무':r.mode),planText(db.people.find(p=>p.id===id),d),r.start?(r.start+'-'+(r.end||'진행 중')):'—',r.end?fmt(duration(r,db.people.find(p=>p.id===id))):'—',esc(r.note)])}))}</div>`}if(tab==='requests'){html=`<div class="panel"><h2>휴무·재택 신청</h2><div class="row"><select id="rp">${options()}</select><input id="rd" type="date" value="${date}"><select id="rt"><option>휴무</option><option>재택근무</option></select></div><p><textarea id="reason" placeholder="신청 사유"></textarea></p><button class="primary" onclick="request()">신청하기</button></div><div class="panel"><h2>관리자 승인 대기 및 이력</h2>${table(['직원','날짜','유형','사유','상태','처리'],db.requests.map((r,i)=>row([esc(db.people.find(p=>p.id===r.id)?.name),r.date,r.type,esc(r.reason),r.status,r.status==='대기'?`<button onclick="approve(${i},true)">승인</button> <button onclick="approve(${i},false)">반려</button>`:'—'])))}</div>`}if(tab==='reports'){let r=db.reports[date+'|'+person]||{};html=`<div class="panel"><h2>일일 업무보고</h2><div class="row"><select onchange="person=this.value;render()">${options()}</select><input type="date" value="${date}" onchange="date=this.value;render()"></div>${[['done','완료한 업무'],['pending','미완료 업무 및 사유'],['next','다음 근무일 계획']].map(([k,l])=>`<p>${l}</p><textarea id="${k}">${esc(r[k])}</textarea>`).join('')}<p><button class="primary" onclick="report()">업무보고 저장</button></p></div><div class="panel"><h2>직원 업무보고 현황</h2>${table(['직원','제출 여부','완료 업무','미완료','다음 계획'],db.people.map(p=>{let r=db.reports[date+'|'+p.id];return row([esc(p.name),r?'제출':'미제출',esc(r?.done),esc(r?.pending),esc(r?.next)])}))}</div>`}if(tab==='schedule'){html=scheduleView()}if(tab==='staff'){html=`<div class="panel"><h2>직원별 근무 일정 설정</h2><div class="row"><label>직원 이름<input id="newname" placeholder="새 직원 이름"></label></div><p>근무 요일</p><div class="row">${['일','월','화','수','목','금','토'].map((d,i)=>`<label style="flex-direction:row"><input type="checkbox" name="newday" value="${i}" ${i>=1&&i<=5?'checked':''}>${d}</label>`).join('')}</div><p class="row"><label>예정 출근<input id="newstart" type="time" required></label><label>예정 퇴근<input id="newend" type="time" required></label><label>휴게시간(분)<input id="newbreak" type="number" min="0" value="0"></label><label>시급(원)<input id="newrate" type="number" min="0" value="0"></label></p><p id="newhours" class="muted">출퇴근 시간을 입력하면 예정 실근무시간을 확인할 수 있습니다.</p><button class="primary" onclick="add()">직원 등록</button></div>`+db.people.map(p=>`<div class="panel"><h2>${esc(p.name)}</h2><div class="row">${['일','월','화','수','목','금','토'].map((d,i)=>`<label style="flex-direction:row"><input type="checkbox" ${p.days.includes(i)?'checked':''} onchange="setday('${p.id}',${i},this.checked)">${d}</label>`).join('')}</div><p class="row">${[['start','예정 출근','time'],['end','예정 퇴근','time'],['break','휴게시간(분)','number'],['rate','시급(원)','number']].map(([k,l,t])=>`<label>${l}<input type="${t}" min="0" value="${p[k]}" onchange="setting('${p.id}','${k}',this.value)"></label>`).join('')}</p><span class="muted">변경 즉시 저장 · 당일 근무 기준, 야간 교대 미지원</span></div>`).join('')} $('view').innerHTML=html;if(tab==='staff'){['newstart','newend','newbreak'].forEach(id=>$(id).addEventListener('input',newHours))}}function rowMark(id){person=id;let p=db.people.find(x=>x.id===id),r=rec(id);render();mark(r.start?'퇴근':plan(p,date)?.mode==='재택근무'?'재택근무':'출근')}function mark(s){if(date!==today()){alert('출퇴근은 오늘 날짜만 등록 가능합니다.');return}let r={...rec(person)};if(s==='휴무'){if(r.start||r.leave)return alert('기존 기록이 있습니다.');tab='requests';render();$('rt').value='휴무';return}if(s==='퇴근'){if(!r.start||r.end)return alert('출근 기록을 확인하세요.');r.end=time();r.endAt=Date.now()}else{if(r.start||r.leave)return alert('기존 근태 기록이 있습니다.');if(s==='재택근무'&&plan(db.people.find(p=>p.id===person),date)?.mode!==s&&!db.requests.some(q=>q.id===person&&q.date===date&&q.type===s&&q.status==='승인')){tab='requests';render();$('rt').value=s;return}r.start=time();r.startAt=Date.now();r.breakMinutes=Number(db.people.find(p=>p.id===person).break||0);r.mode=s}r.note=$('note').value;db.records[date+'|'+person]=r;save();render()}function request(){let id=$('rp').value,d=$('rd').value,type=$('rt').value;if(!d||!$('reason').value.trim())return alert('날짜와 사유를 입력하세요.');if(db.requests.some(r=>r.id===id&&r.date===d&&r.status!=='반려'))return alert('이미 신청이 있습니다.');db.requests.push({id,date:d,type,reason:$('reason').value,status:'대기'});save();render()}function approve(i,ok){let r=db.requests[i];if(ok&&rec(r.id,r.date).start)return alert('이미 근무 기록이 있습니다.');r.status=ok?'승인':'반려';if(ok&&r.type==='휴무')db.records[r.date+'|'+r.id]={leave:true,note:r.reason};save();render()}function report(){db.reports[date+'|'+person]={done:$('done').value,pending:$('pending').value,next:$('next').value};save();render()}function newHours(){let a=$('newstart').value,b=$('newend').value,c=Number($('newbreak').value);$('newhours').textContent=a&&b&&mins(b)>mins(a)&&c>=0&&c<mins(b)-mins(a)?'예정 실근무시간: '+fmt(mins(b)-mins(a)-c):'출퇴근 시간과 휴게시간을 확인해주세요.'}function add(){let n=$('newname').value.trim(),start=$('newstart').value,end=$('newend').value,br=Number($('newbreak').value),rate=Number($('newrate').value),days=[...document.querySelectorAll('[name=newday]:checked')].map(x=>Number(x.value));if(!n||!days.length||!start||!end||mins(end)<=mins(start)||!Number.isFinite(br)||br<0||br>=mins(end)-mins(start)||!Number.isFinite(rate)||rate<0){alert('이름, 근무 요일, 출퇴근 시간 및 휴게시간을 확인해주세요. 당일 근무만 등록 가능합니다.');return}db.people.push({id:Date.now().toString(),name:n,days,start,end,break:br,rate});save();render()}function setting(id,k,v){if(!v||((k==='break'||k==='rate')&&Number(v)<0))return;db.people.find(p=>p.id===id)[k]=v;save()}function setday(id,i,on){let p=db.people.find(p=>p.id===id);p.days=on?[...new Set([...p.days,i])]:p.days.filter(x=>x!==i);save()}function csv(){let rows=[['날짜','직원','유형','출근','퇴근','실근무분','비고']];Object.keys(db.records).filter(k=>k.startsWith(month)).sort().forEach(k=>{let[d,id]=k.split('|'),r=db.records[k],p=db.people.find(p=>p.id===id);rows.push([d,p.name,r.leave?'휴무':r.mode,r.start,r.end,duration(r,p),r.note])});let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='ralledu-'+month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function confirmPlan(id,on){db.confirm[date+'|'+id]=on;save();render()}
function scheduleView(){let ds=db.schedule[month]||{};let list=Object.entries(ds).sort();return `<div class="panel"><h2>월별 예정 근무표 불러오기</h2><p class="muted">원본 구글 시트는 수정하지 않습니다. 불러온 일정과 체크는 이 브라우저에만 저장됩니다.</p><div class="row"><label>대상 월<input type="month" value="${month}" onchange="month=this.value;render()"></label><a href="https://docs.google.com/spreadsheets/d/${sheetId}/edit" target="_blank" rel="noopener">원본 업무대장 열기</a></div><p>방법 A · 구글 시트에서 해당 월 탭 선택 → 파일 → 다운로드 → 쉼표로 구분된 값(.csv)</p><input type="file" id="scheduleCsv" accept=".csv,text/csv"><button onclick="importCsv()">CSV 불러오기</button><hr><p>방법 B · Google 로그인으로 직접 가져오기 (OAuth 설정 필요)</p><input id="clientId" placeholder="Google OAuth 웹 클라이언트 ID" style="width:100%" value="${esc(localStorage.getItem('ralledu-google-client')||'')}"><p><button class="primary" onclick="googleImport()">구글 시트 최신 일정 가져오기</button></p><p class="muted">직원명은 B열, 날짜는 4행, 직원 영역은 강사방문 및 교육 행 이전으로 인식합니다. 빈칸은 예정 없음으로 처리합니다. 단일 근무의 예정 종료는 시작시간 + 업무시간 + 직원 설정 휴게시간으로 계산한 추정값입니다. 분할근무는 원본 확인이 필요합니다.</p></div><div class="panel"><h2>${month} 예정 근무표</h2>${list.length?table(['날짜','직원','예정 유형·시간','확인'],list.flatMap(([d,ps])=>Object.entries(ps).map(([id,q])=>row([`<button onclick="date='${d}';tab='today';render()">${d}</button>`,esc(db.people.find(p=>p.id===id)?.name),planText(db.people.find(p=>p.id===id),d),db.confirm[d+'|'+id]?'확인 완료':'미확인'])))):'아직 불러온 일정이 없습니다.'}</div>`}
function parseCsv(s){let rows=[],r=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&c===','){r.push(v);v=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(quoted)throw Error('CSV 따옴표 형식을 확인하세요.');if(v||r.length){r.push(v);rows.push(r)}return rows}
function normalized(n){return String(n||'').split('\n')[0].trim()}
function importRows(rows,m){let [year,mon]=m.split('-').map(Number),head=rows[3]||[],columns=[];head.forEach((v,i)=>{let a=String(v||'').trim().match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/);if(a&&+a[1]===mon&&+a[2]>=1&&+a[2]<=new Date(year,mon,0).getDate())columns.push([i,`${m}-${String(+a[2]).padStart(2,'0')}`])});if(!columns.length)throw Error('선택한 월과 4행 날짜가 일치하지 않습니다.');let end=rows.findIndex((r,i)=>i>=4&&/강사\s*방문|회의록/.test(String(r[1]||'')+' '+String(r[0]||'')));if(end<0)throw Error('직원 영역 종료 행(강사방문 또는 회의록)을 찾지 못했습니다.');let people=rows.slice(4,end).filter(r=>normalized(r[1])&&String(r[2]||'').trim());if(!people.length)throw Error('직원 이름을 찾지 못했습니다.');let result=Object.fromEntries(columns.map(([i,d])=>[d,{}]));let added=0;for(let r of people){let name=normalized(r[1]);let aliases={'최은희':'은희','황인희':'인희'};let p=db.people.find(x=>normalized(x.name)===name)||db.people.find(x=>x.name===aliases[name]);if(!p){p={id:'sheet-'+Date.now()+'-'+added++,name,days:[],start:'09:00',end:'18:00',break:0,rate:0};db.people.push(p)}else p.name=name;for(let [i,d] of columns){let raw=String(r[i]||'').trim();if(!raw)continue;let matches=[...raw.matchAll(/(?:출근|재택(?:근무)?)\s*:?\s*(\d{1,2}):(\d{2})(?!\d)/g)].filter(x=>+x[1]<24&&+x[2]<60);let hours=raw.match(/업무시간\s*:?\s*(\d+(?:\.\d+)?)/);let start=matches.length?matches[0][1].padStart(2,'0')+':'+matches[0][2]:null;let mode=/재택/.test(raw)?'재택근무':'출근';let multi=matches.length>1||/\d{1,2}:\d{2}\s*[-~]/.test(raw);let label=start?'':/휴\s*일|휴무|병결|여행/.test(raw)?'휴무·기타 일정':'시간 확인 필요';result[d][p.id]={start,mode,hours:hours?Number(hours[1]):null,multi,label};}}db.schedule[m]=result;save();alert(`${m} 근무표 ${people.length}명 · ${columns.length}일 반영 완료`);render()}
async function importCsv(){try{let f=$('scheduleCsv').files[0];if(!f)throw Error('CSV 파일을 선택하세요.');importRows(parseCsv((await f.text()).replace(/^\uFEFF/,'')),month)}catch(e){alert(e.message)}}
function googleImport(){let id=$('clientId').value.trim(),m=month;if(!id)return alert('OAuth 웹 클라이언트 ID를 입력하세요.');if(!globalThis.google?.accounts?.oauth2)return alert('Google 로그인 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');localStorage.setItem('ralledu-google-client',id);let client=google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',callback:async t=>{if(t.error)return alert('Google 권한 오류: '+t.error);try{let tab=Number(m.slice(5))+'월';let url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent("'"+tab+"'!A1:"+(new Date(Number(m.slice(0,4)),Number(m.slice(5)),0).getDate()===31?"AH":"AG")+"40")}`;let res=await fetch(url,{headers:{Authorization:'Bearer '+t.access_token}});let data=await res.json();if(!res.ok)throw Error(data.error?.message||'시트 읽기 실패');importRows(data.values||[],m)}catch(e){alert(e.message)}},error_callback:e=>alert('Google 로그인 오류: '+e.type)});client.requestAccessToken({prompt:'consent'})}
