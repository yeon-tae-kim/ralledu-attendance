<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>롤에듀 (Rall Edu) V8</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#233047;font:14px system-ui,sans-serif}header{background:#172c4e;color:white;padding:24px max(20px,calc((100% - 1100px)/2))}header small{letter-spacing:3px;color:#a9c8ff}h1{margin:8px 0;font-size:26px}main{max-width:1140px;margin:auto;padding:20px}nav,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}nav{margin-bottom:20px}button,input,select,textarea{font:inherit;border:1px solid #d9e0e9;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active,.primary{background:#2857a0;color:white;border-color:#2857a0}button:hover{filter:brightness(.96)}.panel{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:20px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.stat{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:16px}.stat b{display:block;font-size:28px;margin-top:8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.actions button{padding:20px 4px;font-weight:bold;border:0}.green{background:#e0f4e9;color:#167447}.blue{background:#e3ebfa;color:#2857a0}.orange{background:#fff0d8;color:#9d5b08}.purple{background:#eee6fa;color:#7046a9}.gray{background:#edf0f5;color:#68758a}.pill{display:inline-block;padding:5px 9px;border-radius:7px;white-space:nowrap}.muted{color:#6c788b;font-size:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f5}th{background:#f6f8fb;color:#68758a}h2{font-size:18px;margin:0 0 14px}label{display:inline-flex;flex-direction:column;gap:5px}textarea{width:100%;min-height:80px} .warn{background:#fff5e5;padding:12px;border-radius:8px;margin:12px 0}.right{margin-left:auto}@media(max-width:600px){main{padding:12px}.panel{padding:14px}nav button{flex:1;font-size:12px;padding:8px}.actions{grid-template-columns:repeat(2,1fr)}} button:disabled{opacity:.4;cursor:default}.employee{display:grid;grid-template-columns:1fr 1fr;gap:12px}.employee h2{grid-column:1/-1}.big{font-size:22px;font-weight:bold}.actions{grid-column:1/-1}.warn{font-size:12px} @media(max-width:600px){.employee{grid-template-columns:1fr 1fr}}</style><header><small>롤에듀 (Rall Edu) · V8</small><h1>근태 관리</h1><div id="clock"></div></header><main><div class="warn">로컬 체험판 · 관리자/직원 화면 전환은 보안 로그인이 아닙니다. 실제 개인정보·급여 입력 금지. 기록은 이 브라우저에만 저장됩니다.</div><div class="row"><button onclick="role='admin';tab='daily';render()">관리자 화면 체험</button><button onclick="role='employee';tab='daily';render()">직원 화면 체험</button></div><nav id="nav"></nav><div id="view"></div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),time=()=>new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul'}).slice(0,5);let db;try{db=JSON.parse(localStorage.getItem('ralledu-v2'))}catch{}if(!db)db={people:['예시 직원'].map((name,i)=>({id:String(i+1),name,days:[1,2,3,4,5],start:'09:00',end:'18:00',break:60,rate:0})),records:{},requests:[],reports:{}};db.schedule ||= {}; db.confirm ||= {};

let role='admin',tab='daily',date=today(),month=date.slice(0,7),person=db.people[0]?.id,notice='',period='weekly',staffPeriod='weekly',staffId='',reportDate=today();const save=()=>localStorage.setItem('ralledu-v2',JSON.stringify(db));const rec=(id,d=date)=>db.records[d+'|'+id]||{};const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};const fmt=m=>Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'');const clockText=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+(m>=1440?' (+1일)':'');const plan=(p,d)=>db.schedule[d.slice(0,7)]?.[d]?.[p.id];const plannedMinutes=q=>q?.hours==null?null:Math.round(q.hours*60);const range=(q,p)=>!q?'예정 없음':!q.start?esc(q.label):q.multi?esc(q.start)+' · 분할근무 확인':esc(q.start)+'-'+(q.hours==null?'미정':clockText(mins(q.start)+plannedMinutes(q)+Number(p.break||0)));const duration=(r,p)=>r.start&&r.end?Math.max(0,(r.startAt&&r.endAt?Math.floor((r.endAt-r.startAt)/60000):mins(r.end)-mins(r.start))-Number(r.breakMinutes??p.break??0)):null;const state=r=>r.leave?'휴무':r.end?'퇴근 완료':r.start?r.mode+' 중':'미등록';const actual=r=>r.start?esc(r.start)+'-'+esc(r.end||'진행 중'):'—';const show=m=>m==null?'—':fmt(m);const table=(h,rs)=>'<div class="table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';const opts=()=>db.people.map(p=>`<option value="${esc(p.id)}" ${p.id===person?'selected':''}>${esc(p.name)}</option>`).join('');const controls=(p,r)=>`<div style="grid-column:1/-1" class="row"><label>실제 출근시간 (미입력 시 현재 시각)<input type="time" id="start-${esc(p.id)}" value="${esc(r.start||'')}" ${r.start||date!==today()?'disabled':''}></label><label>실제 퇴근시간 (미입력 시 현재 시각)<input type="time" id="end-${esc(p.id)}" value="${esc(r.end||'')}" ${!r.start||r.end||date!==today()?'disabled':''}></label></div><div style="grid-column:1/-1" class="row"><label>점심비<select id="mealtype-${esc(p.id)}" onchange="mealToggle('${p.id}')" ${date!==today()?'disabled':''}><option value="" ${r.meal==null?'selected':''}>선택</option><option value="none" ${r.meal===0?'selected':''}>해당 없음</option><option value="amount" ${r.meal>0?'selected':''}>금액 입력</option></select></label><label>금액 (원)<input id="meal-${esc(p.id)}" type="number" min="1" step="1" value="${r.meal>0?r.meal:''}" ${!(r.meal>0)||date!==today()?'disabled':''}></label><button onclick="saveMeal('${p.id}')" ${date!==today()?'disabled':''}>점심비 저장</button><span class="muted">${mealText(r)}</span></div>`;
const mealText=r=>r.meal==null?'미등록':r.meal===0?'해당 없음':Number(r.meal).toLocaleString()+'원';
function mealToggle(id){$('meal-'+id).disabled=$('mealtype-'+id).value!=='amount'}
function saveMeal(id){if(date!==today()||(role==='employee'&&id!==person))return;let t=$('mealtype-'+id).value,v=Number($('meal-'+id).value);if(!t||t==='amount'&&(!Number.isSafeInteger(v)||v<=0)){alert('해당 없음 또는 올바른 금액을 입력하세요.');return}db.records[date+'|'+id]={...rec(id),meal:t==='none'?0:v};save();render()}
const buttons=p=>['출근','퇴근','재택근무','휴무'].map((s,i)=>`<button class="${['green','blue','purple','orange'][i]}" ${date!==today()|| (s==='퇴근'?(!rec(p.id).start||rec(p.id).end):rec(p.id).start||rec(p.id).leave)?'disabled':''} onclick="mark('${p.id}','${s}')">${s}</button>`).join('');
function mark(id,s){if(date!==today()||(role==='employee'&&id!==person))return;let p=db.people.find(x=>x.id===id),r={...rec(id)},now=time();if(s==='퇴근'){if(!r.start||r.end)return;let v=$('end-'+id).value||now;if(!v||v>now||v<r.start){alert('퇴근시간은 출근 이후이며 현재 시각 이하여야 합니다.');return}r.end=v;r.endAt=Date.parse(date+'T'+v+':00+09:00');r.endRegisteredAt=Date.now()}else{if(r.start||r.leave)return;if(s==='휴무')r.leave=true;else{let v=$('start-'+id).value||now;if(!v||v>now){alert('실제 출근시간은 현재 시각 이하여야 합니다.');return}r.start=v;r.startAt=Date.parse(date+'T'+v+':00+09:00');r.startRegisteredAt=Date.now();r.mode=s;r.breakMinutes=Number(p.break||0)}}db.records[date+'|'+id]=r;save();render()}
function render(){let tabs=role==='admin'?{daily:'일별 근태',monthly:'근태현황',import:'엑셀 불러오기',staff:'직원 관리',pay:'급여 관리'}:{daily:'나의 근태',monthly:'나의 근태현황'};if(!tabs[tab])tab='daily';$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');let people=role==='admin'?db.people:db.people.filter(p=>p.id===person),html='';if(role==='employee')html+=`<div class="panel">체험 직원 선택 <select onchange="person=this.value;render()">${opts()}</select></div>`;if(tab==='daily'){let ps=people.filter(p=>role==='employee'||plan(p,date)||rec(p.id).start||rec(p.id).leave||rec(p.id).meal!=null);html+=`<div class="panel row"><button onclick="shift(-1)">‹</button><input type="date" value="${date}" onchange="date=this.value;render()"><button onclick="shift(1)">›</button><button onclick="date=today();render()">오늘</button></div><div class="stats">${[['근무 예정',ps.filter(p=>plan(p,date)?.start).length+'명'],['예정 근무',fmt(ps.reduce((a,p)=>a+(plannedMinutes(plan(p,date))||0),0))],['실근무 (퇴근 완료)',fmt(ps.reduce((a,p)=>a+(duration(rec(p.id),p)||0),0))]].map(([a,b])=>`<div class="stat">${a}<b>${b}</b></div>`).join('')}</div>${!db.schedule[date.slice(0,7)]?`<div class="warn row"><span>이 달의 엑셀 근무표를 먼저 불러오세요. 기본 근무시간은 표시하지 않습니다.</span>${role==='admin'?'<button class="primary right" onclick="openImport()">근무표 불러오기</button>':''}</div>`:''}${ps.map(p=>{let q=plan(p,date),r=rec(p.id);return `<div class="panel employee"><h2>${esc(p.name)} <span class="pill gray">${state(r)}</span></h2><div>근무 예정시간 · ${esc(q?.mode||'')}<div class="big">${range(q,p)}, ${show(plannedMinutes(q))}</div></div><div>실 근무<div class="big">${actual(r)}, ${show(duration(r,p))}</div></div>${controls(p,r)}<div class="actions">${buttons(p)}</div></div>`}).join('')||'<div class="panel">근무 예정 또는 등록된 기록이 없습니다.</div>'}`}
if(tab==='monthly')html+=reportView(people,period,'period');
if(tab==='pay'){let pay=tab==='pay';html+=`<div class="panel"><h2>${pay?'관리자 급여 추정':'월별 근태'}</h2><input type="month" value="${month}" onchange="month=this.value;render()">${pay?'<p>기본급 추정만 제공 · 주휴, 연장, 세금 제외</p>':''}${table(['직원','예정','실근무','차이','점심비 합계',...(pay?['시급','기본급 추정']:[])],people.map(p=>{let a=Object.values(db.schedule[month]||{}).reduce((n,x)=>n+(plannedMinutes(x[p.id])||0),0),b=Object.entries(db.records).filter(([k])=>k.startsWith(month+'-')&&k.endsWith('|'+p.id)).reduce((n,[k,r])=>n+(duration(r,p)||0),0);return [esc(p.name),fmt(a),fmt(b),(b<a?'-':'+')+fmt(Math.abs(b-a)),Object.entries(db.records).filter(([k])=>k.startsWith(month+'-')&&k.endsWith('|'+p.id)).reduce((n,[k,r])=>n+Number(r.meal||0),0).toLocaleString()+'원',...(pay?[`<input type="number" min="0" value="${Number(p.rate||0)}" onchange="rate('${p.id}',this.value)">`,Math.round(b/60*(p.rate||0)).toLocaleString()+'원']:[])]}))}</div>`;if(!pay)html+=`<div class="panel">${table(['날짜','직원','근무 예정시간','실 근무','점심비'],Object.keys({...db.schedule[month],...Object.fromEntries(Object.keys(db.records).filter(k=>k.startsWith(month+'-')).map(k=>[k.split('|')[0],true]))}).sort().flatMap(d=>people.filter(p=>plan(p,d)||rec(p.id,d).start||rec(p.id,d).leave||rec(p.id,d).meal!=null).map(p=>[d,esc(p.name),range(plan(p,d),p)+', '+show(plannedMinutes(plan(p,d))),actual(rec(p.id,d))+', '+show(duration(rec(p.id,d),p)),mealText(rec(p.id,d))])))}</div>`}
if(tab==='import')html+=`<div class="panel"><h2>월별 엑셀 근무표 불러오기</h2><p>기존 업무대장 .xlsx / .xls 파일 · 해당 월 탭을 읽습니다.</p><input type="month" value="${month}" onchange="month=this.value"><input type="file" id="file" accept=".xlsx,.xls"><button class="primary" onclick="loadExcel()">불러오기</button><p>기존 실제 출퇴근 기록은 유지됩니다. 예정 종료는 출근 + 업무시간 + 설정 휴게시간으로 추정합니다.</p></div>`;if(tab==='staff')html+=`<div class="panel"><h2>직원 관리</h2>${table(['직원','휴게시간(분)'],people.map(p=>[esc(p.name),`<input type="number" min="0" value="${Number(p.break||0)}" onchange="rest('${p.id}',this.value)">`]))}<p>직원은 엑셀에서 자동 등록됩니다.</p></div><div class="panel"><h2>직원별 근태현황</h2><select onchange="staffId=this.value;render()"><option value="">직원 선택</option>${people.map(p=>`<option value="${esc(p.id)}" ${staffId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>${staffId?reportView(people.filter(p=>p.id===staffId),staffPeriod,'staffPeriod'):''}`;$('view').innerHTML=(notice?'<div class="warn">'+esc(notice)+'</div>':'')+html}
function openImport(){if(role!=='admin')return;month=date.slice(0,7);tab='import';render()}
function addDays(d,n){let x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function bounds(kind){let d=reportDate||today();if(kind==='weekly'){let w=new Date(d+'T12:00:00Z').getUTCDay();let a=addDays(d,-((w+6)%7));return [a,addDays(a,6)]}let m=d.slice(0,7),[y,k]=m.split('-').map(Number);return [m+'-01',m+'-'+new Date(Date.UTC(y,k,0)).getUTCDate()]}
function reportShift(kind,n){if(kind==='weekly')reportDate=addDays(reportDate,n*7);else{let [y,m]=reportDate.split('-').map(Number);reportDate=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,10)}render()}
function reportView(people,kind,key){let [a,b]=bounds(kind),dates=[];for(let d=a;d<=b;d=addDays(d,1))dates.push(d);let sums=people.map(p=>{let q=dates.reduce((n,d)=>n+(plannedMinutes(plan(p,d))||0),0),actualM=dates.reduce((n,d)=>n+(duration(rec(p.id,d),p)||0),0),meal=dates.reduce((n,d)=>n+Number(rec(p.id,d).meal||0),0),count=dates.filter(d=>rec(p.id,d).start).length;return [esc(p.name),count+'일',fmt(q),fmt(actualM),(actualM-q<0?'-':'+')+fmt(Math.abs(actualM-q)),meal.toLocaleString()+'원']});let details=dates.flatMap(d=>people.filter(p=>plan(p,d)||rec(p.id,d).start||rec(p.id,d).leave||rec(p.id,d).meal!=null).map(p=>{let q=plan(p,d),r=rec(p.id,d);return [d,esc(p.name),esc(q?.mode||'—'),range(q,p)+', '+show(plannedMinutes(q)),actual(r)+', '+show(duration(r,p)),state(r),mealText(r),r.startRegisteredAt?new Date(r.startRegisteredAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'—',r.endRegisteredAt?new Date(r.endRegisteredAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'—']}));return `<div class="panel"><h2>근태현황 · ${kind==='weekly'?'주간':'월간'}</h2><div class="row"><button class="${kind==='weekly'?'active':''}" onclick="${key}='weekly';render()">주간</button><button class="${kind==='monthly'?'active':''}" onclick="${key}='monthly';render()">월간</button><button onclick="reportShift('${kind}',-1)">‹</button><input type="date" value="${reportDate}" onchange="if(this.value){reportDate=this.value;render()}"><button onclick="reportShift('${kind}',1)">›</button><button onclick="reportDate=today();render()">오늘</button></div><p><b>${a} ~ ${b}</b></p>${dates.some(d=>!db.schedule[d.slice(0,7)])?'<p class="warn">일부 월의 근무표가 등록되지 않았습니다. 예정시간 합계는 불러온 일정만 집계합니다.</p>':''}${table(['직원','출근 등록일','예정 근무','실 근무(퇴근 완료)','차이','점심비 합계'],sums)}<p class="muted">실 근무는 퇴근 완료 기록에서 설정 휴게시간을 차감합니다. 급여는 관리자 급여 메뉴에서만 표시합니다.</p></div><div class="panel"><h2>날짜별 상세 기록</h2>${table(['날짜','직원','예정 유형','근무 예정시간','실 근무','상태','점심비','출근 등록 시각','퇴근 등록 시각'],details)}${details.length?'':'<p>해당 기간에 기록이 없습니다.</p>'}</div>`}
function shift(n){let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);date=d.toISOString().slice(0,10);render()}function rate(id,v){if(role!=='admin')return;db.people.find(p=>p.id===id).rate=Math.max(0,Number(v)||0);save();render()}function rest(id,v){if(role!=='admin')return;db.people.find(p=>p.id===id).break=Math.max(0,Number(v)||0);save();render()}
function normalized(n){return String(n||'').split('\n')[0].trim()}
function importRows(rows,m){let [year,mon]=m.split('-').map(Number),head=rows[3]||[],columns=[];head.forEach((v,i)=>{let a=String(v||'').trim().match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/);if(a&&+a[1]===mon&&+a[2]>=1&&+a[2]<=new Date(year,mon,0).getDate())columns.push([i,`${m}-${String(+a[2]).padStart(2,'0')}`])});if(!columns.length)throw Error('선택한 월과 4행 날짜가 일치하지 않습니다.');let end=rows.findIndex((r,i)=>i>=4&&/강사\s*방문|회의록/.test(String(r[1]||'')+' '+String(r[0]||'')));if(end<0)throw Error('직원 영역 종료 행(강사방문 또는 회의록)을 찾지 못했습니다.');let people=rows.slice(4,end).filter(r=>normalized(r[1])&&String(r[2]||'').trim());if(!people.length)throw Error('직원 이름을 찾지 못했습니다.');let result=Object.fromEntries(columns.map(([i,d])=>[d,{}]));let added=0;for(let r of people){let name=normalized(r[1]);let aliases={'최은희':'은희','황인희':'인희'};let p=db.people.find(x=>normalized(x.name)===name)||db.people.find(x=>x.name===aliases[name]);if(!p){p={id:'sheet-'+Date.now()+'-'+added++,name,days:[],start:'09:00',end:'18:00',break:0,rate:0};db.people.push(p)}else p.name=name;for(let [i,d] of columns){let raw=String(r[i]||'').trim();if(!raw)continue;let matches=[...raw.matchAll(/(?:출근|재택(?:근무)?)\s*:?\s*(\d{1,2}):(\d{2})(?!\d)/g)].filter(x=>+x[1]<24&&+x[2]<60);let hours=raw.match(/업무시간\s*:?\s*(\d+(?:\.\d+)?)/);let start=matches.length?matches[0][1].padStart(2,'0')+':'+matches[0][2]:null;let mode=/재택/.test(raw)?'재택근무':'출근';let multi=matches.length>1||/\d{1,2}:\d{2}\s*[-~]/.test(raw);let label=start?'':/휴\s*일|휴무|병결|여행/.test(raw)?'휴무·기타 일정':'시간 확인 필요';result[d][p.id]={start,mode,hours:hours?Number(hours[1]):null,multi,label};}}db.schedule[m]=result;save();notice=`${m} 근무표 ${people.length}명 · ${columns.length}일 반영 완료`;date=today().slice(0,7)===m?today():m+'-01';tab='daily';render()}

async function loadExcel(){if(role!=='admin')return;try{let f=$('file').files[0];if(!f)throw Error('파일을 선택하세요');if(!window.XLSX)throw Error('엑셀 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),name=Number(month.slice(5))+'월';if(!wb.Sheets[name])throw Error(name+' 탭이 없습니다.');let rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:'',dateNF:'m/d',range:0});importRows(rows,month)}catch(e){alert(e.message)}}render();setInterval(()=>$('clock').textContent=today()+' '+time()+' KST',1000);
</script></html>
