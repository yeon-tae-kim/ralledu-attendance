<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>롤에듀 (Rall Edu) 근태관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#233047;font:14px system-ui,sans-serif}header{background:#172c4e;color:white;padding:24px max(20px,calc((100% - 1100px)/2))}header small{letter-spacing:3px;color:#a9c8ff}h1{margin:8px 0;font-size:26px}main{max-width:1140px;margin:auto;padding:20px}nav,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}nav{margin-bottom:20px}button,input,select,textarea{font:inherit;border:1px solid #d9e0e9;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active,.primary{background:#2857a0;color:white;border-color:#2857a0}button:hover{filter:brightness(.96)}.panel{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:20px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.stat{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:16px}.stat b{display:block;font-size:28px;margin-top:8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.actions button{padding:20px 4px;font-weight:bold;border:0}.green{background:#e0f4e9;color:#167447}.blue{background:#e3ebfa;color:#2857a0}.orange{background:#fff0d8;color:#9d5b08}.purple{background:#eee6fa;color:#7046a9}.gray{background:#edf0f5;color:#68758a}.pill{display:inline-block;padding:5px 9px;border-radius:7px;white-space:nowrap}.muted{color:#6c788b;font-size:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f5}th{background:#f6f8fb;color:#68758a}h2{font-size:18px;margin:0 0 14px}label{display:inline-flex;flex-direction:column;gap:5px}textarea{width:100%;min-height:80px} .warn{background:#fff5e5;padding:12px;border-radius:8px;margin:12px 0}.right{margin-left:auto}@media(max-width:600px){main{padding:12px}.panel{padding:14px}nav button{flex:1;font-size:12px;padding:8px}.actions{grid-template-columns:repeat(2,1fr)}} </style><header><small>롤에듀 (Rall Edu) · PEOPLE</small><h1>출퇴근 관리 대시보드</h1><div id="clock"></div></header><main><div class="warn">체험용 · 이 브라우저에만 저장됩니다. 실제 직원 로그인, 공동 데이터 및 자동 알림 발송은 서버 연결 후 가능합니다.</div><nav id="nav"></nav><div id="view"></div></main><script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),time=()=>new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul'}).slice(0,5);let db;try{db=JSON.parse(localStorage.getItem('ralledu-v2'))}catch{}if(!db)db={people:['송보현','인희','은희'].map((name,i)=>({id:String(i+1),name,days:[1,2,3,4,5],start:'09:00',end:'18:00',break:60,rate:0})),records:{},requests:[],reports:{}};let tab='today',date=today(),month=date.slice(0,7),person=db.people[0].id;const save=()=>localStorage.setItem('ralledu-v2',JSON.stringify(db));const rec=(id,d=date)=>db.records[d+'|'+id]||{};const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};const duration=(r,p)=>r.start&&r.end?Math.max(0,mins(r.end)-mins(r.start)-Number(p.break||0)):0;const fmt=m=>Math.floor(m/60)+'시간 '+m%60+'분';const daynum=d=>new Date(d+'T12:00:00+09:00').getUTCDay();const planned=(p,d)=>p.days.includes(daynum(d));const state=(r)=>r.leave?'휴무':r.end?'퇴근':r.start?r.mode:'미등록';const cls=s=>({'출근':'green','퇴근':'blue','휴무':'orange','재택근무':'purple','미등록':'gray'}[s]||'gray');const pill=s=>`<span class="pill ${cls(s)}">${esc(s)}</span>`;const options=()=>db.people.map(p=>`<option value="${p.id}" ${p.id===person?'selected':''}>${esc(p.name)}</option>`).join('');const tabs={today:'오늘의 근태',month:'월간 근태·급여',requests:'휴무·재택 승인',reports:'업무보고',staff:'직원 관리'};function table(head,rows){return `<div class="table"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function row(a){return '<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}function flags(p,d,r){if(!planned(p,d)||r.leave)return '';if(r.start&&r.start>p.start)return '지각';if(!r.start&&(d<today()||(d===today()&&time()>p.start)))return d<today()?'결근 확인 필요':'출근 미등록';if(r.start&&!r.end&&(d<today()||(d===today()&&time()>p.end)))return '퇴근 미등록';return ''}function render(){ $('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');let html='';if(tab==='today'){let r=rec(person);html=`<div class="stats">${['전체','출근','재택근무','퇴근','휴무','미등록'].map(s=>`<div class="stat">${s}<b>${s==='전체'?db.people.length:db.people.filter(p=>state(rec(p.id))===s).length}</b></div>`).join('')}</div><div class="panel"><h2>나의 근태 등록</h2><div class="row"><select onchange="person=this.value;render()">${options()}</select><input type="date" value="${date}" onchange="date=this.value;render()">${pill(state(r))}</div><div class="actions">${['출근','퇴근','휴무','재택근무'].map(s=>`<button class="${cls(s)}" onclick="mark('${s}')">${s}</button>`).join('')}</div><input id="note" style="width:100%" placeholder="특이사항 (선택)" value="${esc(r.note)}"><p class="muted">출근 ${r.start||'—'} / 퇴근 ${r.end||'—'} · 실제 근무 유형 ${r.mode||'—'}</p></div><div class="panel"><h2>직원별 근무 현황</h2>${table(['직원','상태','예정 시간','출근','퇴근','실근무','확인사항'],db.people.map(p=>{let r=rec(p.id);return row([esc(p.name),pill(state(r)),planned(p,date)?p.start+'~'+p.end:'비근무일',r.start||'—',r.end||'—',r.end?fmt(duration(r,p)):'—',esc(flags(p,date,r))])}))}</div><div class="panel"><h2>근태 확인 알림</h2>${db.people.map(p=>{let f=flags(p,date,rec(p.id));return f?`<p>${esc(p.name)} · ${esc(f)}</p>`:''}).join('')||'<p class="muted">확인할 사항이 없습니다.</p>'}<p class="muted">화면 내 알림이며 외부 메시지는 발송하지 않습니다.</p></div>`}if(tab==='month'){let dates=Object.keys(db.records).filter(k=>k.startsWith(month));html=`<div class="panel"><h2>월간 근태 및 급여 추정</h2><div class="row"><input type="month" value="${month}" onchange="month=this.value;render()"><button onclick="csv()">CSV 저장</button></div><p class="muted">시급 × 휴게시간 차감 근무시간. 주휴·연장·세금 등 미반영, 급여 확정용 아님.</p>${table(['직원','근무일','재택일','휴무일','근무시간','지각','기본급 추정'],db.people.map(p=>{let rs=dates.filter(k=>k.endsWith('|'+p.id)).map(k=>[k.split('|')[0],db.records[k]]);let m=rs.reduce((a,[d,r])=>a+duration(r,p),0);return row([esc(p.name),rs.filter(([d,r])=>r.start).length,rs.filter(([d,r])=>r.mode==='재택근무').length,rs.filter(([d,r])=>r.leave).length,fmt(m),rs.filter(([d,r])=>flags(p,d,r)==='지각').length,Math.round(m/60*p.rate).toLocaleString()+'원'])}))}</div><div class="panel"><h2>상세 기록</h2>${table(['날짜','직원','유형','출근','퇴근','비고'],dates.sort().map(k=>{let [d,id]=k.split('|'),r=db.records[k];return row([d,esc(db.people.find(p=>p.id===id)?.name),esc(r.leave?'휴무':r.mode),r.start||'—',r.end||'—',esc(r.note)])}))}</div>`}if(tab==='requests'){html=`<div class="panel"><h2>휴무·재택 신청</h2><div class="row"><select id="rp">${options()}</select><input id="rd" type="date" value="${date}"><select id="rt"><option>휴무</option><option>재택근무</option></select></div><p><textarea id="reason" placeholder="신청 사유"></textarea></p><button class="primary" onclick="request()">신청하기</button></div><div class="panel"><h2>관리자 승인 대기 및 이력</h2>${table(['직원','날짜','유형','사유','상태','처리'],db.requests.map((r,i)=>row([esc(db.people.find(p=>p.id===r.id)?.name),r.date,r.type,esc(r.reason),r.status,r.status==='대기'?`<button onclick="approve(${i},true)">승인</button> <button onclick="approve(${i},false)">반려</button>`:'—'])))}</div>`}if(tab==='reports'){let r=db.reports[date+'|'+person]||{};html=`<div class="panel"><h2>일일 업무보고</h2><div class="row"><select onchange="person=this.value;render()">${options()}</select><input type="date" value="${date}" onchange="date=this.value;render()"></div>${[['done','완료한 업무'],['pending','미완료 업무 및 사유'],['next','다음 근무일 계획']].map(([k,l])=>`<p>${l}</p><textarea id="${k}">${esc(r[k])}</textarea>`).join('')}<p><button class="primary" onclick="report()">업무보고 저장</button></p></div><div class="panel"><h2>직원 업무보고 현황</h2>${table(['직원','제출 여부','완료 업무','미완료','다음 계획'],db.people.map(p=>{let r=db.reports[date+'|'+p.id];return row([esc(p.name),r?'제출':'미제출',esc(r?.done),esc(r?.pending),esc(r?.next)])}))}</div>`}if(tab==='staff'){html=`<div class="panel"><h2>직원별 근무 일정 설정</h2><div class="row"><label>직원 이름<input id="newname" placeholder="새 직원 이름"></label></div><p>근무 요일</p><div class="row">${['일','월','화','수','목','금','토'].map((d,i)=>`<label style="flex-direction:row"><input type="checkbox" name="newday" value="${i}" ${i>=1&&i<=5?'checked':''}>${d}</label>`).join('')}</div><p class="row"><label>예정 출근<input id="newstart" type="time" required></label><label>예정 퇴근<input id="newend" type="time" required></label><label>휴게시간(분)<input id="newbreak" type="number" min="0" value="0"></label><label>시급(원)<input id="newrate" type="number" min="0" value="0"></label></p><p id="newhours" class="muted">출퇴근 시간을 입력하면 예정 실근무시간을 확인할 수 있습니다.</p><button class="primary" onclick="add()">직원 등록</button></div>`+db.people.map(p=>`<div class="panel"><h2>${esc(p.name)}</h2><div class="row">${['일','월','화','수','목','금','토'].map((d,i)=>`<label style="flex-direction:row"><input type="checkbox" ${p.days.includes(i)?'checked':''} onchange="setday('${p.id}',${i},this.checked)">${d}</label>`).join('')}</div><p class="row">${[['start','예정 출근','time'],['end','예정 퇴근','time'],['break','휴게시간(분)','number'],['rate','시급(원)','number']].map(([k,l,t])=>`<label>${l}<input type="${t}" min="0" value="${p[k]}" onchange="setting('${p.id}','${k}',this.value)"></label>`).join('')}</p><span class="muted">변경 즉시 저장 · 당일 근무 기준, 야간 교대 미지원</span></div>`).join('')} $('view').innerHTML=html;if(tab==='staff'){['newstart','newend','newbreak'].forEach(id=>$(id).addEventListener('input',newHours))}}function mark(s){if(date!==today()){alert('출퇴근은 오늘 날짜만 등록 가능합니다.');return}let r={...rec(person)};if(s==='휴무'){if(r.start||r.leave)return alert('기존 기록이 있습니다.');tab='requests';render();$('rt').value='휴무';return}if(s==='퇴근'){if(!r.start||r.end)return alert('출근 기록을 확인하세요.');r.end=time()}else{if(r.start||r.leave)return alert('기존 근태 기록이 있습니다.');if(s==='재택근무'&&!db.requests.some(q=>q.id===person&&q.date===date&&q.type===s&&q.status==='승인')){tab='requests';render();$('rt').value=s;return}r.start=time();r.mode=s}r.note=$('note').value;db.records[date+'|'+person]=r;save();render()}function request(){let id=$('rp').value,d=$('rd').value,type=$('rt').value;if(!d||!$('reason').value.trim())return alert('날짜와 사유를 입력하세요.');if(db.requests.some(r=>r.id===id&&r.date===d&&r.status!=='반려'))return alert('이미 신청이 있습니다.');db.requests.push({id,date:d,type,reason:$('reason').value,status:'대기'});save();render()}function approve(i,ok){let r=db.requests[i];if(ok&&rec(r.id,r.date).start)return alert('이미 근무 기록이 있습니다.');r.status=ok?'승인':'반려';if(ok&&r.type==='휴무')db.records[r.date+'|'+r.id]={leave:true,note:r.reason};save();render()}function report(){db.reports[date+'|'+person]={done:$('done').value,pending:$('pending').value,next:$('next').value};save();render()}function newHours(){let a=$('newstart').value,b=$('newend').value,c=Number($('newbreak').value);$('newhours').textContent=a&&b&&mins(b)>mins(a)&&c>=0&&c<mins(b)-mins(a)?'예정 실근무시간: '+fmt(mins(b)-mins(a)-c):'출퇴근 시간과 휴게시간을 확인해주세요.'}function add(){let n=$('newname').value.trim(),start=$('newstart').value,end=$('newend').value,br=Number($('newbreak').value),rate=Number($('newrate').value),days=[...document.querySelectorAll('[name=newday]:checked')].map(x=>Number(x.value));if(!n||!days.length||!start||!end||mins(end)<=mins(start)||!Number.isFinite(br)||br<0||br>=mins(end)-mins(start)||!Number.isFinite(rate)||rate<0){alert('이름, 근무 요일, 출퇴근 시간 및 휴게시간을 확인해주세요. 당일 근무만 등록 가능합니다.');return}db.people.push({id:Date.now().toString(),name:n,days,start,end,break:br,rate});save();render()}function setting(id,k,v){if(!v||((k==='break'||k==='rate')&&Number(v)<0))return;db.people.find(p=>p.id===id)[k]=v;save()}function setday(id,i,on){let p=db.people.find(p=>p.id===id);p.days=on?[...new Set([...p.days,i])]:p.days.filter(x=>x!==i);save()}function csv(){let rows=[['날짜','직원','유형','출근','퇴근','실근무분','비고']];Object.keys(db.records).filter(k=>k.startsWith(month)).sort().forEach(k=>{let[d,id]=k.split('|'),r=db.records[k],p=db.people.find(p=>p.id===id);rows.push([d,p.name,r.leave?'휴무':r.mode,r.start,r.end,duration(r,p),r.note])});let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='ralledu-'+month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}setInterval(()=>{$('clock').textContent=today()+'  '+time()+' KST'},1000);$('clock').textContent=today()+'  '+time()+' KST';render();</script></html>
